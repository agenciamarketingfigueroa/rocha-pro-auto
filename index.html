<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="O novo site da RochaPro Auto Peças está em preparação. Consulte peças e kits com nossa equipe pelo WhatsApp.">
  <meta name="theme-color" content="#080808">
  <title>Em breve | RochaPro Auto Peças</title>
  <link rel="icon" href="assets/identidade-visual/01-marca/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/identidade-visual/01-marca/apple-touch-icon-180.png">
  <link rel="stylesheet" href="assets/identidade-visual/02-identidade/tokens.css">
  <style>
    * { box-sizing: border-box; }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
    }

    .shell {
      width: min(100% - 2 * clamp(1.5rem, 6vw, 5.5rem), 80rem);
      margin-inline: auto;
    }

    header { border-bottom: 1px solid #292929; }

    header .shell {
      display: flex;
      align-items: center;
      min-height: 5.5rem;
    }

    header img {
      display: block;
      width: clamp(10.75rem, 20vw, 13.25rem);
      height: auto;
    }

    main {
      position: relative;
      isolation: isolate;
      display: grid;
      flex: 1;
      align-items: center;
      min-height: 34rem;
      background-color: #0d0f11;
    }

    .hero-image,
    main::before {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .hero-image {
      z-index: -2;
      object-fit: cover;
      object-position: right center;
    }

    main::before {
      content: "";
      z-index: -1;
      background: linear-gradient(90deg, #0d0f11 4%, rgba(13, 15, 17, .86) 24%, rgba(13, 15, 17, .36) 49%, transparent 72%);
    }

    .message { padding-block: 4rem 5rem; }

    .message::before {
      content: "";
      display: block;
      width: 3rem;
      height: .25rem;
      margin-bottom: 1.125rem;
      background: var(--rp-red);
    }

    h1 {
      margin: 0;
      font-size: clamp(4.25rem, 9vw, 8rem);
      font-weight: 850;
      line-height: .97;
      letter-spacing: -.065em;
    }

    h1 span { color: var(--rp-red); }

    .description {
      max-width: 23rem;
      margin: 1.5rem 0 2rem;
      color: var(--rp-gray);
      font-size: clamp(1rem, 1.55vw, 1.1875rem);
      line-height: 1.6;
    }

    .contact {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 3.25rem;
      padding: .875rem 1.5rem;
      border-radius: .375rem;
      background: #c60808;
      color: var(--rp-white);
      font-weight: 700;
      text-align: center;
      text-decoration: none;
    }

    .contact:hover { background: #ad0808; }

    .contact:focus-visible {
      outline: 2px solid var(--rp-white);
      outline-offset: 4px;
    }

    @media (max-width: 45rem) {
      header .shell { min-height: 4.5rem; }

      main { align-items: start; }

      .hero-image,
      main::before {
        height: clamp(15rem, 43svh, 23rem);
      }

      .hero-image { object-position: 85% center; }

      main::before {
        background: linear-gradient(180deg, transparent 18%, rgba(13, 15, 17, .18) 43%, #0d0f11 100%);
      }

      .message { padding-block: clamp(12rem, 34svh, 18rem) 3rem; }

      h1 { font-size: clamp(3.25rem, 11vw, 5.125rem); }

      .description { margin-block: 1.125rem 1.5rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="shell">
      <img src="assets/identidade-visual/01-marca/logo-horizontal-claro.svg" width="210" height="53" alt="RochaPro Auto Peças">
    </div>
  </header>
  <main aria-labelledby="page-title">
    <img class="hero-image" src="assets/hero-suspensao.webp" width="1672" height="941" alt="" fetchpriority="high">
    <div class="shell message">
      <h1 id="page-title">Em breve<span>.</span></h1>
      <p class="description">Estamos preparando nosso novo site. Enquanto isso, fale com a nossa equipe para consultar peças e kits.</p>
      <a class="contact" href="https://wa.me/5531973589165">Fale pelo WhatsApp</a>
    </div>
  </main>
</body>
</html>
